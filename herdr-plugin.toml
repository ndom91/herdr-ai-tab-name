id = "ndomino.ai-tab-name"
name = "AI Tab Name"
version = "0.1.0"
min_herdr_version = "0.7.5"
description = "Rename focused Herdr tabs from pane context using a local LLM."
platforms = ["macos", "linux"]

[[events]]
on = "tab.focused"
command = ["python3", "scripts/rename_tab.py"]

[[actions]]
id = "refresh"
title = "Refresh AI tab name"
command = ["python3", "scripts/rename_tab.py", "--force"]
